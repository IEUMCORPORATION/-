</select><button class=\"menu\" id=\"menu\" aria-label=\"Open menu\">☰</button></div></div></header>\n<main><section class=\"hero\" id=\"home\"><div class=\"wrap\"><div class=\"eyebrow\" data-i=\"heroEye\">STUDENT CONSULTING</div><h1 data-i=\"heroTitle\">당신의 꿈이<br>한국에서 이루어질 수 있도록,<br>IEUM이 함께합니다.</h1><p data-i=\"heroText\">한국 대학 입학부터 유학 준비, 학업 계획까지<br>학생 개개인의 목표에 맞춘 전문 컨설팅을 제공합니다.</p><div class=\"actions\"><a class=\"btn\" href=\"#contact\"><span data-i=\"heroCta\">상담 신청하기</span><span>→</span></a><a class=\"btn outline\" href=\"#services\"><span data-i=\"heroMore\">서비스 더보기</span></a></div></div><div class=\"hero-note\">Your Dream<br>Our Support</div></section>\n<section class=\"section\" id=\"services\"><div class=\"wrap\"><div class=\"section-head\"><div><div class=\"eyebrow\" data-i=\"servicesEye\">OUR SERVICES</div><h2 data-i=\"servicesTitle\">유학생을 위한 맞춤형 컨설팅</h2></div><p class=\"intro\" data-i=\"servicesIntro\">IEUM은 한국 유학을 준비하는 학생을 위해 개인의 목표와 상황에 맞춘 전문적인 컨설팅 서비스를 제공합니다.</p></div><div class=\"services\">\n<button class=\"service reveal\" data-service=\"admission\"><div class=\"service-top\"><span class=\"ico\">⌂</span><span class=\"num\">01</span></div><h3 data-i=\"s1Title\">대학교 입학 컨설팅</h3><p data-i=\"s1Text\">학생의 목표와 상황에 맞는 대학 및 학과 탐색, 지원 일정과 준비 서류를 안내합니다.</p><span class=\"more\">→</span></button>\n<button class=\"service reveal\" data-service=\"preparation\"><div class=\"service-top\"><span class=\"ico\">▤</span><span class=\"num\">02</span></div><h3 data-i=\"s2Title\">유학 준비 컨설팅</h3><p data-i=\"s2Text\">유학 계획 수립부터 준비 일정, 필요 서류와 출국 전 준비까지 단계별로 지원합니다.</p><span class=\"more\">→</span></button>\n<button class=\"service reveal\" data-service=\"personal\"><div class=\"service-top\"><span class=\"ico\">☏</span><span class=\"num\">03</span></div><h3 data-i=\"s3Title\">유학생 맞춤 상담</h3><p data-i=\"s3Text\">국가, 언어, 학업 목표와 예산 등 개인 상황을 고려해 현실적인 선택지를 함께 검토합니다.</p><span class=\"more\">→</span></button>\n</div></div></section>\n<section class=\"section soft\" id=\"process\"><div class=\"wrap process\"><div class=\"process-visual reveal\" role=\"img\" aria-label=\"Study abroad planning\"></div><div><div class=\"eyebrow\" data-i=\"processEye\">CONSULTING PROCESS</div><h2 data-i=\"processTitle\">유학 준비, 체계적인 단계로</h2><p class=\"intro\" style=\"margin-top:12px\" data-i=\"processIntro\">상담부터 지원 준비까지 진행 상황을 함께 확인하며 목표에 맞는 유학 계획을 세웁니다.</p><div class=\"steps\" style=\"margin-top:30px\"><div class=\"step\"><div class=\"bubble\">☏</div><b data-i=\"p1Title\">상담 신청 및 목표 파악</b><p data-i=\"p1Text\">희망 전공과 현재 상황, 목표 시기를 확인합니다.</p></div><div class=\"step\"><div class=\"bubble\">▤</div><b data-i=\"p2Title\">맞춤형 계획 수립</b><p data-i=\"p2Text\">대학, 학과와 준비 일정을 함께 정리합니다.</p></div><div class=\"step\"><div class=\"bubble\">✓</div><b data-i=\"p3Title\">지원 준비 안내</b><p data-i=\"p3Text\">지원 서류와 주요 절차를 점검합니다.</p></div><div class=\"step\"><div class=\"bubble\">✈</div><b data-i=\"p4Title\">출국 전 최종 점검</b><p data-i=\"p4Text\">출국 전 필요한 준비 사항을 확인합니다.</p></div></div></div></div></section>\n<section class=\"cta\" id=\"why\"><div class=\"wrap cta-in\"><div><div class=\"eyebrow\" style=\"color:#a9c7e2\" data-i=\"ctaEye\">YOUR NEXT CHAPTER</div><h2 data-i=\"ctaTitle\">한국 유학의 첫걸음,<br>IEUM과 함께 시작하세요.</h2><p data-i=\"ctaText\">목표에 맞는 선택을 할 수 있도록 준비 과정에 함께하겠습니다.</p></div><a class=\"btn\" href=\"#contact\"><span data-i=\"ctaButton\">상담 문의하기</span><span>→</span></a></div></section>\n<section class=\"contact\" id=\"contact\"><div class=\"wrap contact-grid\"><div id=\"about\"><div class=\"eyebrow\" data-i=\"contactEye\">CONTACT IEUM</div><h2 data-i=\"contactTitle\">상담 문의하기</h2><p class=\"contact-copy\" data-i=\"contactText\">유학 계획과 궁금한 점을 남겨주세요. 입력한 내용을 바탕으로 이메일 문의를 준비할 수 있습니다.</p><div class=\"contact-links\"><a href=\"https://line.me/\" target=\"_blank\" rel=\"noopener\">LINE ↗</a><a href=\"https://www.whatsapp.com/\" target=\"_blank\" rel=\"noopener\">WhatsApp ↗</a><a href=\"index.html\">IEUM 홈 ↗</a></div></div><div><form id=\"inquiry\"><input name=\"name\" placeholder=\"이름 / Name\" req d-template-columns:1fr 1fr}.step{padding:18px 14px;border-bottom:1px solid var(--line)}.cases-grid{grid-template-columns:1fr}.contact-form{grid-template-columns:1fr}.field.full,.form-note{grid-column:auto}.footer-row{align-items:flex-start;flex-direction:column}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}\n</style></head><body>\n<header class=\"header\"><a class=\"brand\" href=\"#home\" aria-label=\"IEUM 홈\"><strong>IEUM</strong><span>Global Business<br>Consulting</span></a>\n<button class=\"menu-btn\" id=\"menuBtn\" aria-expanded=\"false\" aria-controls=\"mainNav\">☰ 메뉴</button>\n<nav class=\"nav\" id=\"mainNav\" aria-label=\"주요 메뉴\"><a href=\"#home\" data-i18n=\"navHome\">홈</a><a href=\"#services\" data-i18n=\"navServices\">서비스 소개</a><a href=\"#process\" data-i18n=\"navProcess\">컨설팅 프로세스</a><a href=\"#cases\" data-i18n=\"navCases\">성공사례</a><a href=\"#about\" data-i18n=\"navAbout\">회사 소개</a><a href=\"#contact\" data-i18n=\"navContact\">문의하기</a></nav>\n<div class=\"lang\" aria-label=\"언어 선택\"><button class=\"active\" data-lang=\"ko\">KR</button><span>|</span><button data-lang=\"en\">EN</button><span>|</span><button data-lang=\"th\">TH</button></div></header>\n<main>\n<section class=\"hero\" id=\"home\"><div class=\"hero-content\"><div class=\"eyebrow\">GLOBAL BUSINESS CONSULTING</div><h1 data-i18n=\"heroTitle\">더 넓은 세상으로,<br>당신의 비즈니스를 연결합니다.</h1><p data-i18n=\"heroDesc\">IEUM은 글로벌 시장의 기회를 발견하고,<br>기업의 지속 가능한 성장을 위한 맞춤형 컨설팅을 제공합니다.</p><a class=\"btn\" href=\"#contact\"><span data-i18n=\"heroCta\">컨설팅 상담하기</span><span aria-hidden=\"true\">→</span></a></div><div class=\"hero-tag\">Your Global<br>Growth Partner</div><div class=\"hero-controls\"><span>01</span><span style=\"color:#8a96a5\">03</span><span style=\"display:inline-block;width:54px;height:2px;background:#172b45\"></span><button aria-label=\"이전 슬라이드\" id=\"prevSlide\">←</button><button aria-label=\"다음 슬라이드\" id=\"nextSlide\">→</button></div></section>\n<section class=\"section services\" id=\"services\"><div class=\"wrap services-grid\"><div class=\"service-intro reveal\"><div class=\"section-kicker\">OUR SERVICES</div><h2 data-i18n=\"serviceTitle\">기업 맞춤형 글로벌 컨설팅</h2><p class=\"section-intro\" data-i18n=\"serviceDesc\">IEUM은 기업의 해외 진출과 글로벌 비즈니스를 위한 전문적인 컨설팅 서비스를 제공합니다.</p><a class=\"btn outline\" href=\"#contact\"><span data-i18n=\"serviceCta\">서비스 문의하기</span><span>→</span></a></div><div class=\"service-grid reveal\">\n<a class=\"service-card\" href=\"#service-market\"><div class=\"icon\">◎</div><h3 data-i18n=\"s1\">해외 시장 진출 전략</h3><p data-i18n=\"s1d\">글로벌 시장 분석을 통한 최적의 진출 전략을 제안합니다.</p></a>\n<a class=\"service-card\" href=\"#service-partner\"><div class=\"icon\">♧</div><h3 data-i18n=\"s2\">현지 파트너십 개발</h3><p data-i18n=\"s2d\">신뢰할 수 있는 현지 파트너 발굴 및 협력을 지원합니다.</p></a>\n<a class=\"service-card\" href=\"#service-strategy\"><div class=\"icon\">↗</div><h3 data-i18n=\"s3\">사업 전략 컨설팅</h3><p data-i18n=\"s3d\">기업의 성장과 경쟁력 강화를 위한 전략을 수립합니다.</p></a>\n<a class=\"service-card\" href=\"#service-network\"><div class=\"icon\">⌘</div><h3 data-i18n=\"s4\">글로벌 네트워크 구축</h3><p data-i18n=\"s4d\">전 세계의 다양한 네트워크를 통해 비즈니스 기회를 제공합니다.</p></a>\n<a class=\"service-card\" href=\"#service-project\"><div class=\"icon\">▤</div><h3 data-i18n=\"s5\">프로젝트 조율 및 관리</h3><p data-i18n=\"s5d\">프로젝트 전반의 원활한 진행을 위해 체계적으로 관리합니다.</p></a>\n<a class=\"service-card\" href=\"#service-research\"><div class=\"icon\">⌕</div><h3 data-i18n=\"s6\">비즈니스 리서치</h3><p data-i18n=\"s6d\">정확한 시장 조사와 분석으로 최적의 의사결정을 지원합니다.</p></a></div></div></section>\n<section class=\"section why\" id=\"about\"><div class=\"wrap why-grid\"><div class=\"reveal\"><div class=\"section-kicker\">WHY IEUM</div><h2 data-i18n=\"whyTitle\">국경을 넘어,<br>가능성을 현실로 연결합니다.</h2><p class=\"section-intro\" data-i18n=\"whyDesc\">시장에 대한 이해와 현지 네트워크, 실행 중심의 조율 역량으로 기업의 글로벌 성장을 함께 설계합니다.</p><a class=\"btn\" href=\"#contact\"><span data-i18n=\"aboutCta\">IEUM과 함께하기</span><span>→</span></a></div><div class=\"principles reveal\"><div class=\"principle\"><b>01 / INSIGHT</b><p data-i18n=\"p1\">현지 시장과 산업에 대한 실질적인 이해</p></div><div class=\"principle\"><b>02 / CONNECTION</b><p data-i18n=\"p2\">목표에 맞는 파트너와 기회의 연결</p></div><div class=\"principle\"><b>03 / EXECUTION</b><p data-i18n=\"p3\">실행 가능한 계획과 체계적인 프로젝트 운영</p></div><div class=\"principle\"><b>04 / GROWTH</b><p data-i18n=\"p4\">지속 가능한 성장을 위한 장기적 관점</p></div></div></div></section>\n<section class=\"section process\" id=\"process\"><div class=\"wrap\"><div class=\"section-kicker\">HOW WE WORK</div><h2 data-i18n=\"processTitle\">목표에서 실행까지, 명확한 프로세스</h2><p class=\"section-intro\" data-i18n=\"processDesc\">각 기업의 상황과 목표에 맞춰 필요한 단계를 설계합니다.</p><div class=\"steps\"><div class=\"step\"><span>01</span><h3 data-i18n=\"step1\">이해</h3><p data-i18n=\"step1d\">목표와 과제를 파악합니다.</p></div><div class=\"step\"><span>02</span><h3 data-i18n=\"step2\">조사</h3><p data-i18n=\"step2d\">시장과 기회를 분석합니다.</p></div><div class=\"step\"><span>03</span><h3 data-i18n=\"step3\">설계</h3><p data-i18n=\"step3d\">실행 가능한 전략을 만듭니다.</p></div><div class=\"step\"><span>04</span><h3 data-i18n=\"step4\">연결 및 실행</h3><p data-i18n=\"step4d\">파트너와 프로젝트를 조율합니다.</p></div></div></div></section>\n<section class=\"section\" id=\"cases\"><div class=\"wrap\"><div class=\"section-kicker\">FOCUS AREAS</div><h2 data-i18n=\"casesTitle\">IEUM이 연결하는 비즈니스 기회</h2><div class=\"cases-grid\"><article class=\"case\" id=\"service-market\"><small>01 / MARKET</small><h3 data-i18n=\"c1\">해외 시장 진출</h3><p data-i18n=\"c1d\">시장 환경 조사, 진입 가능성 검토, 현지화 전략 수립</p></article><article class=\"case\" id=\"service-partner\"><small>02 / PARTNERSHIP</small><h3 data-i18n=\"c2\">현지 파트너 발굴</h3><p data-i18n=\"c2d\">협력 후보 조사, 커뮤니케이션 지원, 협업 구조 설계</p></article><article class=\"case\" id=\"service-strategy\"><small>03 / STRATEGY</small><h3 data-i18n=\"c3\">성장 전략 수립</h3><p data-i18n=\"c3d\">사업 목표 정리, 경쟁 환경 분석, 실행 계획 구체화</p></article><article class=\"case\" id=\"service-network\"><small>04 / NETWORK</small><h3 data-i18n=\"c4\">글로벌 네트워크</h3><p data-i18n=\"c4d\">국가별 이해관계자와 기회를 연결하는 협력 기반 구축</p></article><article class=\"case\" id=\"service-project\"><small>05 / PROJECT</small><h3 data-i18n=\"c5\">프로젝트 조율</h3><p data-i18n=\"c5d\">일정, 커뮤니케이션, 이해관계자 및 진행 상황 관리</p></article><article class=\"case\" id=\"service-research\"><small>06 / RESEARCH</small><h3 data-i18n=\"c6\">시장 리서치</h3><p data-i18n=\"c6d\">의사결정에 필요한 시장 정보와 기초 자료 조사</p></article></div></div></section>\n<section class=\"section contact\" id=\"contact\"><div class=\"wrap contact-grid\"><div><div class=\"section-kicker\">CONTACT IEUM</div><h2 data-i18n=\"contactTitle\">글로벌 비즈니스의 다음 단계를 함께 논의하세요.</h2><p class=\"section-intro\" data-i18n=\"contactDesc\">사업 목표와 관심 국가를 알려주시면 상담을 위한 이메일 초안을 준비합니다.</p><p><strong>IEUM</strong><br>Global Business Consulting</p></div><form class=\"contact-form\" id=\"contactForm\"><div class=\"field\"><label for=\"name\" data-i18n=\"labelName\">성함 / 담당자</label><input id=\"name\" name=\"name\" required placeholder=\"홍길동\"></div><div class=\"field\"><label for=\"email\" data-i18n=\"labelEmail\">이메일</label><input id=\"email\" name=\"email\" type=\"email\" required placeholder=\"name@company.com\"></div><div class=\"field\"><label for=\"company\" data-i18n=\"labelCompany\">회사명</label><input id=\"company\" name=\"company\" placeholder=\"회사명\"></div><div class=\"field\"><label for=\"topic\" data-i18n=\"labelTopic\">문의 분야</label><select id=\"topic\" name=\"topic\"><option>해외 시장 진출</option><option>현지 파트너십</option><option>사업 전략</option><option>시장 리서치</option><option>기타</option></select></div><div class=\"field full\"><label for=\"message\" data-i18n=\"labelMessage\">문의 내용</label><textarea id=\"message\" name=\"message\" required placeholder=\"목표 국가, 협력 내용, 문의 사항 등을 적어주세요.\"></textarea></div><button class=\"btn field full\" type=\"submit\"><span data-i18n=\"send\">이메일 문의 초안 만들기</span><span>→</span></button><p class=\"form-note\" data-i18n=\"formNote\">이 양식은 이메일 앱에서 발송 초안을 엽니다. 실제 웹사이트 문의 수신을 위해서는 서버 또는 폼 서비스 연동이 필요합니다. const frame = document.getElementById('page');
let currentPage = 'main';
let lastHash = '';

function renderPage(name) {
  if (!Object.prototype.hasOwnProperty.call(pages, name)) name = 'main';
  currentPage = name;
  frame.srcdoc = pages[name];
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function showPage(name, addHistory = true) {
  if (!Object.prototype.hasOwnProperty.call(pages, name)) name = 'main';
  if (addHistory) {
    const state = { ieumPage: name };
    if (history.state && history.state.ieumPage === name) {
      history.replaceState(state, '', location.pathname + location.search + '#page-' + name);
    } else {
      history.pushState(state, '', location.pathname + location.search + '#page-' + name);
    }
  }
  renderPage(name);
}

// Keep browser Back/Forward synchronized with the page shown inside the single HTML file.
if (history.state && history.state.ieumPage) {
  renderPage(history.state.ieumPage);
} else {
  history.replaceState({ ieumPage: 'main' }, '', location.pathname + location.search + '#page-main');
  renderPage('main');
}
window.addEventListener('popstate', (event) => {
  const page = event.state && event.state.ieumPage;
  renderPage(page || 'main');
});

frame.addEventListener('load', () => {
  try {
    const doc = frame.contentDocument;
    if (!doc || doc.documentElement.dataset.ieumRouterReady === '1') return;
    doc.documentElement.dataset.ieumRouterReady = '1';

    // Route only page-navigation links. Leave section anchors, mailto links and external links alone.
    doc.addEventListener('click', (event) => {
      const a = event.target.closest && event.target.closest('a[href]');
      if (!a) return;
      const rawHref = (a.getAttribute('href') || '').trim();
      if (!rawHref || rawHref.startsWith('#') || /^(mailto:|tel:|https?:|javascript:)/i.test(rawHref)) return;

      let pathname = rawHref.split(/[?#]/)[0];
      try { pathname = decodeURIComponent(pathname); } catch (_) {}
      const clean = pathname.replace(/^\.\//, '').replace(/^\.\.\//, '').toLowerCase();
      const studentRoutes = ['컨설팅_학생.html', 'ieum_student_consulting.html', 'student.html', 'student'];
      const corporateRoutes = ['컨설팅_기업.html', 'ieum_corporate_consulting.html', 'corporate.html', 'corporate'];
      const homeRoutes = ['', 'index.html', './index.html', '../index.html', '컨설팅_메인.html', '컨설팅_메인_링크수정.html', 'main.html'];

      if (studentRoutes.includes(clean)) {
        event.preventDefault(); event.stopPropagation(); showPage('student');
      } else if (corporateRoutes.includes(clean)) {
        event.preventDefault(); event.stopPropagation(); showPage('corporate');
      } else if (homeRoutes.includes(clean)) {
        event.preventDefault(); event.stopPropagation(); showPage('main');
      }
    }, true);
  } catch (e) {
    console.error('IEUM page navigation setup failed:', e);
  }
});
</script>
